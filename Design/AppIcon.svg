<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- iCapture 앱 아이콘(B안: 선택 영역 속 코드). macOS 규격: 1024 캔버스 중앙의 824 둥근 사각형.
       그림자는 scripts/render-app-icon.swift가 그릴 때 덧붙인다(SVG 필터 없이도 렌더링되게). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A3140"/>
      <stop offset="1" stop-color="#11141B"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.13"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#gloss)"/>
  <rect x="230" y="260" width="564" height="504" rx="36" fill="none" stroke="#8FB4FF" stroke-width="18" stroke-dasharray="54 30" stroke-linecap="round"/>
  <g fill="#E8ECF4">
    <rect x="300" y="350" width="300" height="44" rx="22"/>
    <rect x="350" y="440" width="230" height="44" rx="22"/>
    <rect x="350" y="530" width="140" height="44" rx="22"/>
    <rect x="300" y="620" width="260" height="44" rx="22"/>
  </g>
  <rect x="510" y="526" width="96" height="52" rx="12" fill="#FFD84A"/>
  <rect x="510" y="582" width="96" height="10" rx="5" fill="#FF9F0A"/>
  <rect x="700" y="700" width="22" height="170" rx="11" fill="#0A84FF" transform="rotate(-35 711 785)"/>
  <circle cx="652" cy="712" r="40" fill="#0A84FF"/>
  <circle cx="652" cy="712" r="18" fill="#FFFFFF"/>
</svg>
