name: iCapture
options:
  bundleIdPrefix: dev.local
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.3"
    DEAD_CODE_STRIPPING: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ARCHS: arm64
    ENABLE_HARDENED_RUNTIME: YES
schemes:
  iCapture:
    build:
      targets:
        iCapture: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - iCaptureTests
  iCaptureAccuracy:
    build:
      targets:
        iCaptureAccuracyTests: [test]
    test:
      config: Debug
      targets:
        - iCaptureAccuracyTests
      environmentVariables:
        - variable: ICAPTURE_ACCURACY
          value: $(ICAPTURE_ACCURACY)
        - variable: ANTHROPIC_API_KEY
          value: $(ANTHROPIC_API_KEY)
        - variable: NATIV_MODEL
          value: $(NATIV_MODEL)
        - variable: LOCAL_MODEL
          value: $(LOCAL_MODEL)
        - variable: LOCAL_BASE_URL
          value: $(LOCAL_BASE_URL)
        - variable: LOCAL_API_KEY
          value: $(LOCAL_API_KEY)
targets:
  iCapture:
    type: application
    platform: macOS
    configFiles:
      Debug: Configuration/Signing.xcconfig
      Release: Configuration/Signing.xcconfig
    sources:
      - path: Sources/iCapture
    dependencies:
      - sdk: Security.framework
      - sdk: ScreenCaptureKit.framework
      - sdk: Vision.framework
      - sdk: Carbon.framework
      - sdk: ServiceManagement.framework
    settings:
      base:
        ARCHS: arm64
        ENABLE_HARDENED_RUNTIME: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.iCapture
        # 프로젝트 폴더 이름(icapture)과 상관없이 앱 파일은 iCapture.app으로 만든다.
        PRODUCT_NAME: iCapture
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
  iCaptureTests:
    type: bundle.unit-test
    platform: macOS
    configFiles:
      Debug: Configuration/Signing.xcconfig
      Release: Configuration/Signing.xcconfig
    sources:
      - path: Tests/iCaptureTests
      - path: Sources/iCapture/Core
    dependencies:
      - sdk: Security.framework
      - sdk: Vision.framework
      - sdk: Carbon.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.iCaptureTests
        GENERATE_INFOPLIST_FILE: YES
  iCaptureAccuracyTests:
    type: bundle.unit-test
    platform: macOS
    configFiles:
      Debug: Configuration/Signing.xcconfig
      Release: Configuration/Signing.xcconfig
    sources:
      - path: Tests/iCaptureAccuracyTests
      - path: Sources/iCapture/Core
      - path: Tests/AccuracyFixtures
        buildPhase: resources
    dependencies:
      - sdk: Security.framework
      - sdk: Vision.framework
      - sdk: Carbon.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.iCaptureAccuracyTests
        GENERATE_INFOPLIST_FILE: YES
